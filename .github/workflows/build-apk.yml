name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK Platforms
        run: |
          ANDROID_SDK_PATH=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          echo "sdk.dir=$ANDROID_SDK_PATH" > android/local.properties
          mkdir -p "$ANDROID_SDK_PATH/licenses"
          yes | $ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
          ANDROID_SDK_PATH=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          echo "sdk.dir=$ANDROID_SDK_PATH" > android/local.properties

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: madrasti-live-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
